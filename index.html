
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Art Gallery</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

<!-- BACK WALL -->
<a-box position="0 0.5 -0.5"
  width="1" height="1" depth="0.05"
  color="#FFFFFF"></a-box>

<!-- LEFT WALL -->
<a-box position="-0.5 0.5 0"
  width="0.05" height="1" depth="1"
  color="#FFFFFF"></a-box>

<!-- RIGHT WALL -->
<a-box position="0.5 0.5 0"
  width="0.05" height="1" depth="1"
  color="#FFFFFF"></a-box>

<!-- FLOOR -->
<a-box position="0 0 0"
  width="1" height="0.05" depth="1"
  color="#FFFFFF"></a-box>

<!-- ROOF -->
<a-box position="0 1 0"
  width="1" height="0.05" depth="1"
  color="#FFFFFF"></a-box>

<!-- FRONT WALL -->
<a-box position="0 0.5 0.5"
  width="1" height="1" depth="0.05"
  color="#FFFFFF"></a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>
</body>
</html>
